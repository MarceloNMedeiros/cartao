<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Cartão de Visitas - Marcelo Medeiros</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f3f5f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      padding: 24px 32px 28px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .logo-wrapper {
      margin-bottom: 16px;
    }
    .logo-wrapper img {
      max-width: 160px;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    .name {
      font-size: 1.6rem;
      font-weight: 600;
      color: #1f2933;
      margin-bottom: 4px;
    }
    .role {
      font-size: 0.98rem;
      color: #52606d;
      margin-bottom: 16px;
    }
    .divider {
      height: 1px;
      background: #e0e7ff;
      margin: 12px 0 18px;
    }
    .contact {
      font-size: 0.95rem;
      color: #364152;
      line-height: 1.6;
      text-align: left;
    }
    .contact strong {
      color: #111827;
    }
    .contact a {
      color: #1d4ed8;
      text-decoration: none;
    }
    .contact a:hover {
      text-decoration: underline;
    }
    .footer-note {
      margin-top: 18px;
      font-size: 0.8rem;
      color: #9aa5b1;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrapper">
      <img src="inmetro-logo.png" alt="Logo INMETRO">
    </div>

    <div class="name">Marcelo Medeiros</div>
    <div class="role">[Seu cargo / área de atuação]</div>

    <div class="divider"></div>

    <div class="contact">
      <p>
        <strong>Email:</strong>
        <a href="mailto:seuemail@exemplo.com">seuemail@exemplo.com</a>
      </p>
      <p>
        <strong>Telefone:</strong>
        (21) 99999-9999
      </p>
      <p>
        <strong>LinkedIn:</strong>
        <a href="https://linkedin.com/in/seuusuario" target="_blank">
          linkedin.com/in/seuusuario
        </a>
      </p>
    </div>

    <div class="footer-note">
      Cartão de visitas digital
    </div>
  </div>
</body>
</html>
