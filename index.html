<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Cartão de Visitas - Marcelo Medeiros</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      padding: 24px 32px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .logo img {
      max-width: 160px;
      margin-bottom: 16px;
    }
    .name {
      font-size: 1.6rem;
      font-weight: bold;
      margin-bottom: 4px;
      color: #1f2933;
    }
    .role {
      color: #52606d;
      margin-bottom: 16px;
    }
    .contact {
      text-align: left;
      font-size: 0.95rem;
      color: #364152;
      line-height: 1.6;
    }
    .contact a {
      color: #1d4ed8;
      text-decoration: none;
    }
    .contact a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="logo">
      <img src="inmetro-logo.png" alt="Logo INMETRO">
    </div>

    <div class="name">Marcelo Medeiros</div>
    <div class="role">[Seu cargo]</div>

    <div class="contact">
      <p><strong>Email:</strong> <a href="mailto:seuemail@exemplo.com">seuemail@exemplo.com</a></p>
      <p><strong>Telefone:</strong> (21) 99999-9999</p>
      <p><strong>LinkedIn:</strong> <a href="https://linkedin.com/in/seuusuario" target="_blank">linkedin.com/in/seuusuario</a></p>
    </div>

  </div>
</body>
</html>
